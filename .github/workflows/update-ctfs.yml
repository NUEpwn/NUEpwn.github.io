name: Kommende CTFs aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"   # täglich ca. 06:17/07:17 deutscher Zeit
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_ctfs.py
      - .github/workflows/update-ctfs.yml

permissions:
  contents: write

concurrency:
  group: update-ctfs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CTFtime abrufen
        run: python3 scripts/update_ctfs.py
      - name: Änderungen committen
        run: |
          if git diff --quiet -- data/ctfs.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ctfs.json
          git commit -m "Kommende CTFs aktualisieren"
          git push
